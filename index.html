<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Diet Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>
    
    <!-- Theme Toggle -->
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
    
    <div class="container">
        <!-- Enhanced Dashboard -->
        <div class="dashboard-wrapper">
            <h1 class="app-title">Diet Tracker</h1>
            <div class="macros-header">
                <div class="macro-col">
                    <div class="macro-label">PROTEIN</div>
                    <div class="macro-value-container">
                        <span class="macro-value val-p" id="p-val">0</span>
                        <span class="macro-target">/ 153g</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar bg-p" id="p-bar"></div>
                    </div>
                </div>
                <div class="macro-col">
                    <div class="macro-label">FAT</div>
                    <div class="macro-value-container">
                        <span class="macro-value val-f" id="f-val">0</span>
                        <span class="macro-target">/ 71g</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar bg-f" id="f-bar"></div>
                    </div>
                </div>
                <div class="macro-col">
                    <div class="macro-label">CARBS</div>
                    <div class="macro-value-container">
                        <span class="macro-value val-c" id="c-val">0</span>
                        <span class="macro-target">/ 251g</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar bg-c" id="c-bar"></div>
                    </div>
                </div>
                <div class="macro-col">
                    <div class="macro-label">CALORIES</div>
                    <div class="macro-value-container">
                        <span class="macro-value val-k" id="k-val">0</span>
                        <span class="macro-target">/ 2254</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar bg-k" id="k-bar"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="meals-container"></div>

        <!-- Water Tracker -->
        <div class="water-tracker-container">
            <h2 class="section-title">Hydration Tracker</h2>
            <div class="water-glasses" id="water-glasses">
                <!-- Glasses generated by JS -->
            </div>
            <div class="water-progress-text"><span id="water-count">0</span> / 8 Glasses</div>
        </div>

        <div class="reset-btn-container">
            <button class="reset-btn" onclick="resetDay()">
                <svg class="reset-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                Reset Daily Progress
            </button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
